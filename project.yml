name: OliveLamp
options:
  bundleIdPrefix: pl.dabusoft
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  LampKit:
    path: Packages/LampKit
  # Updates: besides the user's own OliveTin servers, the only network use of the app, and it can be turned off.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  OliveLamp:
    type: application
    platform: macOS
    sources:
      - Lamp
    info:
      path: Lamp/Info.plist
      properties:
        CFBundleDisplayName: Olive Lamp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Dabusoft. MIT License."
        # OliveTin often lives at a LAN address or a .local name, over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Olive Lamp talks to the OliveTin servers you add.
        # olivelamp://run links from the Raycast extension; each needs the token from actions.json.
        CFBundleURLTypes:
          - CFBundleURLName: pl.dabusoft.olivelamp
            CFBundleURLSchemes: [olivelamp]
        # Sparkle: the feed is attached to every published GitHub release, the key checks each update's signature.
        SUFeedURL: https://github.com/DabuSoft-pl/olive-lamp/releases/latest/download/appcast.xml
        SUPublicEDKey: ov41jrERHiq96QoHi9d7qdiXY2GEwEhNMNmtFETmbWg= # gitleaks:allow (public half of the Sparkle key)
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_NAME: Olive Lamp
        PRODUCT_BUNDLE_IDENTIFIER: pl.dabusoft.olivelamp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Lamp/Lamp.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: LampKit
        product: LampDomain
      - package: LampKit
        product: LampApplication
      - package: LampKit
        product: LampInfrastructure
      - package: Sparkle
        product: Sparkle
schemes:
  OliveLamp:
    build:
      targets:
        OliveLamp: all
